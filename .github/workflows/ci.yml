name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: every job can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # Actions are pinned to full commit SHAs, not tags, so a moved tag
      # cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks CLI runs directly instead of gitleaks-action. On push
      # events the action scans only the pushed commit range, and a range
      # that starts at the root commit fails and scans nothing at all.
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -sSfL --retry 3 -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir"
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"

      # Every commit on every fetched ref, not just the ones in this push.
      # Findings are printed redacted and no report file is written, because
      # a report would contain whatever leaked. .gitleaksignore holds the
      # reviewed false positives, each pinned to the commit it appears in.
      - name: Scan every commit
        run: |
          gitleaks git . --redact --verbose --no-banner --log-opts="--all --full-history"

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "1"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # No backend and no credentials: init only downloads providers, and
      # validate checks the configuration offline.
      - name: terraform validate (every module and example)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          status=0
          for dir in $(find organization security governance platform examples -name '*.tf' -printf '%h\n' | sort -u); do
            echo "::group::$dir"
            if ! (cd "$dir" && terraform init -backend=false -input=false -no-color >/dev/null && terraform validate -no-color); then
              echo "::error::terraform validate failed in $dir"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
